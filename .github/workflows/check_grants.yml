name: Check Stroganovka Grants

on:
  schedule:
    - cron: '0 */24 * * *' # Автозапуск каждые 24 часа
  workflow_dispatch: # Кнопка для ручного запуска

jobs:
  run-parser:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Скачиваем код
        uses: actions/checkout@v4

      - name: Настраиваем Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Устанавливаем библиотеки
        run: |
          pip install requests beautifulsoup4

      - name: Запускаем парсер
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          python stroganovka_tg.py

      - name: Сохраняем историю
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add seen_stroganovka.json
          git commit -m "Auto-update seen links [skip ci]" || exit 0
          git push
